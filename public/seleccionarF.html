<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seleccionar Especialidad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style>
      body, html {
        height: 100%;
        margin: 0;
        background-color: #ffffff;
        overflow-x: hidden;
      }
      
      .slide-button {
        border: none;
        background: transparent;
        width: 100%;
        height: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        outline: none;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
        transform: none !important;
        transition: none !important;
      }
      .slide-button:focus, 
      .slide-button:active, 
      .slide-button:hover {
        outline: none !important;
        box-shadow: none !important;
        transform: none !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body class="d-flex flex-column justify-content-between">
 
    <header class="2px shadow-sm py-2 px-3">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <a class="navbar-brand m-0" href="#">
          <img src="https://hc.edu.uy/images/imagenesarticulos/Logo_Hc.jpg" style="max-width: 150px; height: auto;" alt="Hospital de Clinicas">
        </a>
        <form class="d-flex flex-grow-1" role="search">
          <input class="form-control rounded-pill text-muted" type="search" placeholder="Buscar" aria-label="Buscar" style="border: 2px solid #ccc;"/>
        </form>
      </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center">
      <div id="carouselExample" class="carousel slide w-100 h-100">
        <div class="carousel-inner text-center h-100">
            
          <div class="carousel-item active h-100">
            <button class="slide-button" onclick="location.href='sub_CardiologiaF.html'">
              <div class="card border-0 bg-transparent" style="max-width: 18rem;">
                <img src="Captura de pantalla 2026-07-31 203626.png" class="mx-auto" alt="Cardiología" style="max-width: 150px; height: auto;">
                <div class="card-body pt-2">
                  <h5 class="card-title fw-bold text-dark fs-3">Cardiologia</h5>
                </div>
              </div>
            </button>
          </div>

          <div class="carousel-item h-100">
            <button class="slide-button" onclick="location.href='pulmonologia.html'">
              <div class="card border-0 bg-transparent" style="max-width: 18rem;">
                <img src="Captura de pantalla 2026-07-31 203831.png" class="mx-auto" alt="Pulmonología" style="max-width: 150px; height: auto;">
                <div class="card-body pt-2">
                  <h5 class="card-title fw-bold text-dark fs-3">Pulmonologia</h5>
                </div>
              </div>
            </button>
          </div>

          <div class="carousel-item h-100">
            <button class="slide-button" onclick="location.href='oseologia.html'">
              <div class="card border-0 bg-transparent" style="max-width: 18rem;">
                <img src="Captura de pantalla 2026-07-31 203937.png" class="mx-auto" alt="Oseología" style="max-width: 150px; height: auto;">
                <div class="card-body pt-2">
                  <h5 class="card-title fw-bold text-dark fs-3">Oseologia</h5>
                </div>
              </div>
            </button>
          </div>

        </div>
      </div>
    </main>

    <footer class="w-100" style="border-top: 2px solid #222;">
      <div class="d-flex w-100" style="height: 300px;">
        <button class="btn rounded-0 flex-fill d-flex align-items-center justify-content-center bg-light border-0 text-secondary shadow-none" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <svg viewBox="0 0 24 24" width="56" height="56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        
        <div style="border-left: 2px solid #222;"></div>
        
        <button class="btn rounded-0 flex-fill d-flex align-items-center justify-content-center bg-light border-0 text-secondary shadow-none" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <svg viewBox="0 0 24 24" width="56" height="56" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
  </body>
</html>
