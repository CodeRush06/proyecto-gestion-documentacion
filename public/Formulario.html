<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radiocardiografia - Inicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <style>
      body {
        margin: 0;
        background-color: #ffffff;
        overflow-x: hidden;
      }

      .slide-button {
        border: none;
        background: transparent;
        width: 100%;
        padding: 0;
        outline: none;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
        transform: none !important;
        transition: none !important;
      }
      .slide-button:focus, 
      .slide-button:active, 
      .slide-button:hover {
        outline: none !important;
        box-shadow: none !important;
        transform: none !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100">
    
    <header class="shadow-sm py-2 px-3">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <a class="navbar-brand m-0" href="#">
          <img src="https://hc.edu.uy/images/imagenesarticulos/Logo_Hc.jpg" style="max-width: 150px; height: auto;" alt="Hospital de Clinicas">
        </a>
        <form class="d-flex flex-grow-1" role="search">
          <input class="form-control rounded-pill text-muted" type="search" placeholder="Buscar" aria-label="Buscar" style="border: 2px solid #ccc;"/>
        </form>
      </div>
    </header>

    <main class="flex-grow-1 container py-4 d-flex flex-column">
      <div class="row g-4 justify-content-center align-items-stretch flex-grow-1">

        <div class="col-12 col-md-12 col-lg-12 d-flex">
          <button class="slide-button d-flex" onclick="location.href='Formulario.html'">
            <div class="card border-1 shadow-sm bg-transparent text-center w-100 h-100 d-flex flex-column align-items-center justify-content-center p-4">
              <img src="Captura de pantalla 2026-07-31 230451.png" class="mx-auto img-fluid my-2" alt="Formulario" style="max-width: 120px; height: auto;">
              <div class="card-body pt-3">
                <h5 class="card-title fw-bold text-dark fs-4 m-0" id="Formulario">Formulario</h5>
               
              </div>
            </div>
          </button>
        </div>

      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script>
      // OBJETIVO: QUE SI NO MUESTRA FORMULARIOS. LO DIGA
      let Formulario = document.getElementById("Formulario")
      let Contenido = document.createElement("div");
      Contenido.innerHTML = "No se encuentran formularios";
      Formulario.insertAdjacentElement("afterend", Contenido);
    </script>
  </body>
</html>
